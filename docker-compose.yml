x-api-env: &api-env
  DATABASE_URL: postgresql://courtly:courtly@postgres:5432/courtly
  NODE_ENV: development

services:
  postgres:
    image: postgres:18-alpine
    container_name: courtly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtly -d courtly"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: api
    environment: *api-env
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
