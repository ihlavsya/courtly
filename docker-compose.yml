services:
  postgres:
    image: postgres:18-alpine
    container_name: courtly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtly -d courtly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
